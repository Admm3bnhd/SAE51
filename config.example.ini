# Exemple de configuration de l'inventaire réseau.
# Copier ce fichier en "config.ini" puis l'adapter :
#     cp config.example.ini config.ini
# config.ini est ignoré par Git car il peut contenir des secrets SNMP.

[general]
# Fichier SQLite où est stocké l'inventaire
base_de_donnees = inventaire.db
# Nombre d'hôtes interrogés en parallèle
threads = 64
# Temps d'attente d'une réponse ICMP (secondes, entier)
delai_ping = 1
# Ports TCP testés sur chaque hôte (sert à deviner le type d'équipement)
ports_tcp = 22 23 53 80 443 445 631 3389 8080 9100
# Temps d'attente d'une connexion TCP (secondes)
delai_tcp = 0.5
# Base des constructeurs IEEE (voir scripts/telecharger_oui.sh)
fichier_oui = data/oui.txt

[snmp]
# Mettre "non" pour désactiver complètement SNMP
actif = oui
# "2c" (communauté, en clair) ou "3" (authentifié et chiffré)
version = 2c
communaute = public

# --- SNMPv3 uniquement ---
# utilisateur = inventaire
# niveau = authPriv
# auth_protocole = SHA
# auth_motdepasse = MotDePasseAuth
# priv_protocole = AES
# priv_motdepasse = MotDePassePriv

# Délai d'attente (s) et nombre de ré-émissions par requête
delai = 1
essais = 1
